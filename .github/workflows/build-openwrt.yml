name: Build JCG Q30 Pro

on:
  workflow_dispatch:
    inputs:
      source:
        description: 选择要构建的源码
        required: true
        default: all
        type: choice
        options:
          - all
          - padavan
          - lede
          - rebase
  repository_dispatch:
    types:
      - build

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.source || github.event.client_payload.source || 'all' }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.matrix.outputs.release_tag }}
      selection: ${{ steps.matrix.outputs.selection }}
    steps:
      - name: Select sources
        id: matrix
        env:
          SELECTED_SOURCE: ${{ github.event.inputs.source || github.event.client_payload.source || 'all' }}
        run: |
          set -euo pipefail

          matrix=$(jq -cn --arg selected "$SELECTED_SOURCE" '
            [
              {
                source_id: "padavan",
                repo_url: "https://github.com/padavanonly/immortalwrt-mt798x-6.6.git",
                repo_branch: "openwrt-24.10-6.6",
                config_file: "configs/padavan.config"
              },
              {
                source_id: "lede",
                repo_url: "https://github.com/coolsnowwolf/lede.git",
                repo_branch: "master",
                config_file: "configs/lede.config"
              },
              {
                source_id: "rebase",
                repo_url: "https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git",
                repo_branch: "25.12",
                config_file: "configs/rebase.config"
              }
            ]
            | map(select($selected == "all" or .source_id == $selected))
            | {include: .}
          ')

          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "Unsupported source: $SELECTED_SOURCE" >&2
            exit 1
          fi

          release_tag="$(date +'%Y.%m.%d-%H%M')-jcg-q30-pro-${SELECTED_SOURCE}-r${GITHUB_RUN_NUMBER}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "selection=$SELECTED_SOURCE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.source_id }} / jcg_q30_pro
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y dos2unix jq python3-netifaces libfuse-dev
          curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh | sudo bash
          sudo timedatectl set-timezone "$TZ"

      - name: Clone ${{ matrix.source_id }} source
        run: |
          set -euo pipefail
          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ matrix.repo_branch }}" \
            "${{ matrix.repo_url }}" \
            openwrt
          git -C openwrt rev-parse HEAD

      - name: Prepare feeds
        env:
          SOURCE_ID: ${{ matrix.source_id }}
        run: |
          set -euo pipefail
          cd openwrt

          project_mirrors_file="scripts/projectsmirrors.json"
          if [ -f "$project_mirrors_file" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "$project_mirrors_file"
          fi

          "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Load and verify configuration
        env:
          SOURCE_ID: ${{ matrix.source_id }}
          CONFIG_FILE: ${{ matrix.config_file }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig
          "$GITHUB_WORKSPACE/scripts/verify-config.sh" "$SOURCE_ID" .config
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/${SOURCE_ID}-diffconfig.txt"

      - name: Download packages
        run: |
          set -euo pipefail
          cd openwrt
          make download -j8
          find dl -size -1024c -print -delete

      - name: Compile firmware
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Stage ${{ matrix.source_id }} release files
        env:
          SOURCE_ID: ${{ matrix.source_id }}
          REPO_URL: ${{ matrix.repo_url }}
          REPO_BRANCH: ${{ matrix.repo_branch }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          target_dirs=(openwrt/bin/targets/*/*)
          if [ "${#target_dirs[@]}" -ne 1 ] || [ ! -d "${target_dirs[0]}" ]; then
            echo "Expected exactly one target output directory, found ${#target_dirs[@]}" >&2
            exit 1
          fi

          mkdir -p staged
          copied=0
          for file in "${target_dirs[0]}"/*; do
            [ -f "$file" ] || continue
            case "$file" in
              *.bin|*.itb|*.img|*.ubi|*.gz|*.json|*.manifest|*.buildinfo)
                cp "$file" "staged/${SOURCE_ID}-$(basename "$file")"
                copied=$((copied + 1))
                ;;
            esac
          done

          if [ "$copied" -eq 0 ]; then
            echo "No firmware files were produced" >&2
            exit 1
          fi

          commit=$(git -C openwrt rev-parse HEAD)
          {
            echo "source=$SOURCE_ID"
            echo "repository=$REPO_URL"
            echo "branch=$REPO_BRANCH"
            echo "commit=$commit"
            echo "device=jcg_q30-pro"
          } > "staged/${SOURCE_ID}-source-info.txt"
          cp "${SOURCE_ID}-diffconfig.txt" "staged/${SOURCE_ID}-diffconfig.txt"
          (cd staged && sha256sum * > "${SOURCE_ID}-SHA256SUMS")

      - name: Upload ${{ matrix.source_id }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcg-q30-pro-${{ matrix.source_id }}
          path: staged/*
          if-no-files-found: error
          retention-days: 7

      - name: Show disk usage
        if: ${{ !cancelled() }}
        run: df -hT

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jcg-q30-pro-*
          path: release
          merge-multiple: true

      - name: Generate release notes
        env:
          SELECTION: ${{ needs.prepare.outputs.selection }}
        run: |
          cat > release.txt <<EOF
          JCG Q30 Pro 固件

          本次构建选择：${SELECTION}

          固件文件均以源码标识开头：
          - padavan：padavanonly/immortalwrt-mt798x-6.6（openwrt-24.10-6.6）
          - lede：coolsnowwolf/lede（master）
          - rebase：chasey-dev/immortalwrt-mt798x-rebase（25.12）

          每组固件附带 source-info、diffconfig 和 SHA256SUMS。核心 LuCI 能力：
          pbr、ddns、wireguard、acme、wol、msd_lite、upnp、turboacc。
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: JCG Q30 Pro - ${{ needs.prepare.outputs.selection }} - ${{ needs.prepare.outputs.release_tag }}
          body_path: release.txt
          files: release/*
          fail_on_unmatched_files: true
